<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Sudoku{% endblock %}</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    h1 { margin-bottom: 0.5rem; }
    .card { background: #fff; padding: 1.5rem 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    table.board { border-collapse: collapse; margin: 1rem 0; }
    table.board td { border: 1px solid #999; padding: 0; }
    table.board td:nth-child(3n+1) { border-left: 2px solid #333; }
    table.board tr:nth-child(3n+1) td { border-top: 2px solid #333; }
    table.board tr:last-child td { border-bottom: 2px solid #333; }
    table.board td:last-child { border-right: 2px solid #333; }
    table.board input { width: 2.2rem; height: 2.2rem; text-align: center; font-size: 1.2rem; border: none; }
    table.board input[readonly] { background: #e0e0e0; font-weight: bold; color: #222; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .actions form { display: inline; }
    button, select { padding: 0.4rem 0.8rem; font-size: 1rem; }
    .status { font-weight: bold; }
    .status.WON { color: #1a8a1a; }
    .errors { color: #b00020; }
    .hint-form { display: flex; gap: 0.4rem; align-items: center; }
    .hint-form input[type=number] { width: 3rem; }
    a { color: #333; }
  </style>
</head>
<body>
  <h1>Sudoku</h1>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
