<svg width="920" height="440" viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="440" fill="#ffffff"/>

  <!-- Start -->
  <ellipse cx="90" cy="60" rx="70" ry="34" fill="#eef4ff" stroke="#4a78c9" stroke-width="1.5"/>
  <text x="90" y="65" font-size="13" text-anchor="middle" fill="#20406e">Empty board</text>

  <!-- Fill full solution -->
  <rect x="230" y="30" width="220" height="60" rx="8" fill="#ffffff" stroke="#3f9e5b" stroke-width="1.5"/>
  <text x="340" y="55" font-size="13" text-anchor="middle" fill="#1e5e33">Fill full solution</text>
  <text x="340" y="72" font-size="11" text-anchor="middle" fill="#1e5e33">SolutionGenerator + SudokuSolver</text>

  <!-- Pick next cell (loop entry) -->
  <rect x="230" y="140" width="220" height="55" rx="8" fill="#fff5e8" stroke="#c98a2d" stroke-width="1.5"/>
  <text x="340" y="163" font-size="13" text-anchor="middle" fill="#7a4a10">Pick next cell</text>
  <text x="340" y="180" font-size="11" text-anchor="middle" fill="#7a4a10">in random order</text>

  <!-- Remove value -->
  <rect x="230" y="240" width="220" height="50" rx="8" fill="#fff5e8" stroke="#c98a2d" stroke-width="1.5"/>
  <text x="340" y="270" font-size="13" text-anchor="middle" fill="#7a4a10">Remove its value</text>

  <!-- Decision: still unique -->
  <polygon points="340,320 460,370 340,420 220,370" fill="#fdeef0" stroke="#c9455a" stroke-width="1.5"/>
  <text x="340" y="365" font-size="12" text-anchor="middle" fill="#7a1d2b">Still exactly</text>
  <text x="340" y="380" font-size="12" text-anchor="middle" fill="#7a1d2b">one solution?</text>

  <!-- Keep the hole -->
  <rect x="540" y="240" width="170" height="50" rx="8" fill="#eefaf0" stroke="#3f9e5b" stroke-width="1.5"/>
  <text x="625" y="270" font-size="13" text-anchor="middle" fill="#1e5e33">Keep the hole</text>

  <!-- Put value back -->
  <rect x="40" y="240" width="170" height="50" rx="8" fill="#fdeef0" stroke="#c9455a" stroke-width="1.5"/>
  <text x="125" y="270" font-size="13" text-anchor="middle" fill="#7a1d2b">Put the value back</text>

  <!-- Decision: clue count matches -->
  <polygon points="700,340 820,390 700,440 580,390" fill="#eef4ff" stroke="#4a78c9" stroke-width="1.5"/>
  <text x="700" y="385" font-size="12" text-anchor="middle" fill="#20406e">Clue count</text>
  <text x="700" y="400" font-size="12" text-anchor="middle" fill="#20406e">matches difficulty?</text>

  <!-- Puzzle ready -->
  <ellipse cx="700" cy="90" rx="80" ry="34" fill="#eefaf0" stroke="#3f9e5b" stroke-width="1.5"/>
  <text x="700" y="95" font-size="13" text-anchor="middle" fill="#1e5e33">Puzzle ready</text>

  <!-- Arrows -->
  <line x1="160" y1="60" x2="230" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="90" x2="340" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="195" x2="340" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="290" x2="340" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Yes -> keep -->
  <line x1="420" y1="345" x2="600" y2="265" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="500" y="290" font-size="11" fill="#666">Yes</text>

  <!-- No -> restore -->
  <line x1="260" y1="345" x2="125" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="170" y="310" font-size="11" fill="#666">No</text>

  <!-- keep/restore -> clue-count decision -->
  <line x1="625" y1="290" x2="680" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="125" y1="290" x2="125" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="125" y1="390" x2="580" y2="390" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- clue-count decision -> loop back (No) -->
  <path d="M700,340 C700,250 500,170 460,167" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="600" y="200" font-size="11" fill="#666">No, keep digging</text>

  <!-- clue-count decision -> puzzle ready (Yes) -->
  <line x1="700" y1="340" x2="700" y2="124" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="710" y="235" font-size="11" fill="#666">Yes</text>
</svg>
