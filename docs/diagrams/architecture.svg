<svg width="920" height="560" viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

  <!-- Presentation layer -->
  <rect x="20" y="20" width="880" height="90" rx="10" fill="#eef4ff" stroke="#4a78c9" stroke-width="1.5"/>
  <text x="40" y="42" font-size="14" font-weight="bold" fill="#20406e">presentation</text>
  <rect x="60" y="55" width="220" height="42" rx="8" fill="#ffffff" stroke="#4a78c9"/>
  <text x="170" y="80" font-size="13" text-anchor="middle" fill="#20406e">CLI (SudokuCLI)</text>
  <rect x="640" y="55" width="220" height="42" rx="8" fill="#ffffff" stroke="#4a78c9"/>
  <text x="750" y="80" font-size="13" text-anchor="middle" fill="#20406e">Web (FastAPI + Jinja2)</text>

  <!-- Application layer -->
  <rect x="20" y="140" width="880" height="120" rx="10" fill="#eefaf0" stroke="#3f9e5b" stroke-width="1.5"/>
  <text x="40" y="162" font-size="14" font-weight="bold" fill="#1e5e33">application</text>
  <rect x="120" y="180" width="420" height="60" rx="8" fill="#ffffff" stroke="#3f9e5b"/>
  <text x="330" y="205" font-size="13" text-anchor="middle" fill="#1e5e33">Use cases</text>
  <text x="330" y="223" font-size="11" text-anchor="middle" fill="#1e5e33">NewGame, SetCellValue, GetHint, RestartGame, GetGameState</text>
  <rect x="600" y="180" width="240" height="60" rx="8" fill="#ffffff" stroke="#3f9e5b"/>
  <text x="720" y="215" font-size="13" text-anchor="middle" fill="#1e5e33">GameStateDTO</text>

  <!-- Domain layer -->
  <rect x="20" y="290" width="880" height="130" rx="10" fill="#fff5e8" stroke="#c98a2d" stroke-width="1.5"/>
  <text x="40" y="312" font-size="14" font-weight="bold" fill="#7a4a10">domain</text>
  <rect x="60" y="330" width="220" height="70" rx="8" fill="#ffffff" stroke="#c98a2d"/>
  <text x="170" y="370" font-size="13" text-anchor="middle" fill="#7a4a10">Game / Board / Cell</text>
  <rect x="340" y="330" width="280" height="70" rx="8" fill="#ffffff" stroke="#c98a2d"/>
  <text x="480" y="358" font-size="13" text-anchor="middle" fill="#7a4a10">PuzzleGenerator</text>
  <text x="480" y="376" font-size="11" text-anchor="middle" fill="#7a4a10">SolutionGenerator + DiggingHolesGenerator</text>
  <rect x="680" y="330" width="180" height="70" rx="8" fill="#ffffff" stroke="#c98a2d"/>
  <text x="770" y="370" font-size="13" text-anchor="middle" fill="#7a4a10">SudokuSolver</text>

  <!-- Infrastructure layer -->
  <rect x="20" y="450" width="880" height="90" rx="10" fill="#fdeef0" stroke="#c9455a" stroke-width="1.5"/>
  <text x="40" y="472" font-size="14" font-weight="bold" fill="#7a1d2b">infrastructure</text>
  <rect x="330" y="485" width="260" height="42" rx="8" fill="#ffffff" stroke="#c9455a"/>
  <text x="460" y="510" font-size="13" text-anchor="middle" fill="#7a1d2b">GameRepository (in-memory)</text>

  <!-- Arrows -->
  <line x1="170" y1="97" x2="330" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="97" x2="500" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="240" x2="330" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="210" x2="600" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="240" x2="460" y2="485" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="400" x2="770" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="450" font-size="11" fill="#666" text-anchor="middle">use cases call the repository directly to load/save games</text>
</svg>
